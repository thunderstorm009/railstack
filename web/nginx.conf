user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # Docker's embedded DNS server. Every container on a user-defined network
    # resolves service names through 127.0.0.11.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The API upstream.
    #
    # `resolve` tells nginx to re-resolve the hostname instead of caching the
    # IP forever. Without it nginx would keep the IP it saw at startup and
    # start returning 502 forever after the api container was replaced with a
    # new IP. `zone` is mandatory when `resolve` is used.
    upstream reli_api {
        zone reli_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Proxy-level liveness. It does NOT touch the API on purpose: the proxy
        # must stay "healthy" while the API is down, so the failure shows up
        # as a 502 to the user instead of an unhealthy container.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Reverse proxy to the API. The trailing slash on proxy_pass keeps the
        # original URI (/api/hello) instead of stripping the /api prefix.
        location /api/ {
            proxy_pass http://reli_api;

            # Required for upstream keepalive connections.
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward the original client information to the API.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Fail fast when the API is down instead of hanging the client.
            proxy_connect_timeout 2s;
            proxy_read_timeout    10s;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
